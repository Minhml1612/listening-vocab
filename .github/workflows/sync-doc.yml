name: Sync Google Doc Vocab

on:
  schedule:
    - cron: '0 */3 * * *'  # Chạy tự động mỗi 3 tiếng một lần 24/7
  workflow_dispatch:       # Nút bấm thủ công "Run workflow" trên GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sync Script
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID || '1fEDLcsNSUEAyS_lczHTDs5mT9Z24_6nMrHeu3ypPgZ4' }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/sync_doc.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/vocab.json js/default-data.js BANG_TU_VUNG.html
          git diff --staged --quiet || (git commit -m "chore(sync): auto-sync vocabulary from Google Docs [skip ci]" && git push)
